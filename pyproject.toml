[project]
name = "nanodecode"
version = "0.1.0"
description = "A decode engine from scratch for Qwen3-1.7B. Every kernel hand-written, benchmarked against vLLM."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "David Bellamy" }]
dependencies = [
    "safetensors>=0.8.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.15", "ty", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanodecode"]

# ---------------------------------------------------------------------------
# Lint + format: ruff (Astral). This file is the SOURCE OF TRUTH for code standards
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import-sort, N naming, W warnings, UP pyupgrade,
# B bugbear, SIM simplify, C4 comprehensions, PIE, RET returns, RUF ruff,
# PT pytest, TC type-checking blocks, PTH use-pathlib.
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4", "PIE", "RET", "RUF", "PT", "TC", "PTH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests do not need docstrings.
"tests/**" = ["D"]

# ---------------------------------------------------------------------------
# Type checking: ty (Astral). Replaces mypy.
# ty is pre-1.0 and reads sensible defaults; keep config minimal and pin the
# environment so local and CI agree.
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

# ---------------------------------------------------------------------------
# Tests: pytest. --strict-markers/--strict-config fail on typos in markers or
# config rather than silently ignoring them.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU"]
